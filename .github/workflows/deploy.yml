name: Production deployment

# Amplify builds and deploys every push to main from its own webhook and
# reports nothing back to GitHub. This workflow records each push as a
# deployment to the production environment and passes only once the live site
# serves that exact commit (in /version.json and in the page itself), so the
# Deployments section shows what is really live. It needs no AWS credentials.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A re-run of an older push would wait for a commit that a newer deploy has
  # already replaced: it would fail after the timeout and, through the
  # concurrency group below, cancel the newer push's check. So the deployment
  # job only runs while this commit is still the head of main. Otherwise it is
  # skipped and no deployment is recorded: the commit is neither shown as live
  # nor as failed, because it was superseded, not broken.
  current:
    name: Is this commit still the head of main?
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.head.outputs.head }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if ! head=$(gh api "repos/$REPO/commits/$BRANCH" --jq .sha); then
            # Checking the live site is truthful either way, so an API hiccup
            # should not stop the deployment from being recorded.
            echo "::warning::Could not read the head of $BRANCH; checking the deployment anyway."
            echo "head=true" >> "$GITHUB_OUTPUT"
          elif [ "$head" = "$SHA" ]; then
            echo "head=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SHA is no longer the head of $BRANCH ($head is); no deployment is recorded for it."
            echo "head=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Wait for the live site to serve this commit
    needs: current
    if: needs.current.outputs.head == 'true'
    runs-on: ubuntu-latest
    # A newer push cancels the wait for an older one: the older deployment ends
    # instead of waiting for a commit that the newer deploy has replaced. The
    # group is on this job, not the workflow, so a skipped re-run never joins it.
    concurrency:
      group: production-deployment
      cancel-in-progress: true
    # A backstop above the script's own 15-minute limit.
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.juliocesardb.com
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/wait-for-deploy.mjs
        env:
          SITE_URL: https://www.juliocesardb.com
          EXPECTED_COMMIT: ${{ github.sha }}
          TIMEOUT_SECONDS: 900
          INTERVAL_SECONDS: 15
